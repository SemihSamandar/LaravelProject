version: "3.8"

services:
    app:
        image: php:8.3-fpm
        container_name: laravel_app
        working_dir: /var/www
        volumes:
            - ./:/var/www
        depends_on:
            - db

    db:
        image: mysql:8
        container_name: mysql_container
        restart: always
        environment:
            MYSQL_DATABASE: laravel
            MYSQL_ROOT_PASSWORD: password
        ports:
            - "3307:3306"

    phpmyadmin:
        image: phpmyadmin/phpmyadmin
        container_name: phpmyadmin
        restart: always
        depends_on:
            - db
        ports:
            - "8080:80"
        environment:
            PMA_HOST: db
            PMA_PORT: 3306
